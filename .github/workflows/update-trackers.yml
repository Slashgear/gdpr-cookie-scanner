name: Update Tracker DB

on:
  schedule:
    # 1st of every month at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

concurrency:
  group: update-tracker-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/tracker-db-update
      DATA_FILE: src/classifiers/tracker-list.ts

    steps:
      - uses: actions/checkout@v7
        with:
          # Optional PAT / GitHub App token: PRs pushed with the default
          # GITHUB_TOKEN do not trigger the CI workflow.
          token: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch & merge tracker lists
        run: bun run update-trackers

      - name: Format
        run: bun fmt --no-script "$DATA_FILE"

      # Compare only after formatting, otherwise a formatting-only difference
      # opens a PR that contains nothing but a changeset.
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- "$DATA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$DATA_FILE"
          fi

      - name: Type-check
        if: steps.diff.outputs.changed == 'true'
        run: bun run typecheck

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          TITLE="chore: monthly tracker DB update ($(date -u '+%B %Y'))"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A single, reused branch: a pending update is refreshed instead of
          # piling up one PR per month.
          git checkout -B "$BRANCH"

          cat > .changeset/tracker-db-update.md << 'CHANGESET'
          ---
          "@slashgear/gdpr-cookie-scanner": patch
          ---

          chore: monthly tracker DB update from Disconnect.me and DuckDuckGo Tracker Radar
          CHANGESET

          git add "$DATA_FILE" .changeset/tracker-db-update.md
          git commit -m "chore: update tracker DB from Disconnect.me and DuckDuckGo Tracker Radar"
          git push --force origin "$BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" << 'BODY'
          ## Summary

          Automated update of `src/classifiers/tracker-list.ts`.

          - **Sources**: [Disconnect.me](https://github.com/disconnectme/disconnect-tracking-protection) · [DuckDuckGo Tracker Blocklists](https://github.com/duckduckgo/tracker-blocklists)
          - Manually curated entries and `consentRequired: false` overrides are preserved unchanged.
          - New entries are appended in the `AUTO-GENERATED` section (prevalence ≥ 0.1 %).
          - This PR is refreshed by every run until it is merged.

          ## Test plan

          - [ ] `bun run typecheck` passes
          - [ ] Review the diff in `tracker-list.ts` for obviously incorrect category assignments
          - [ ] Spot-check 2–3 new domains against their actual tracker type
          BODY

          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
