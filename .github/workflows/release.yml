name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Fork release: no npm publish. `changeset tag` creates the vX.Y.Z git tag only;
      # the action then pushes it and, with createGithubReleases, creates the GitHub release.
      - name: Create release PR or tag the release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bunx changeset tag
          title: "chore: release new version"
          commit: "chore: release new version"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract released version
        if: steps.changesets.outputs.published == 'true'
        id: version
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION=$(echo "$PUBLISHED" | jq -r '.[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # dist/ was built above, so the tarball contains the compiled package.
      - name: Pack tarball
        if: steps.changesets.outputs.published == 'true'
        run: npm pack --ignore-scripts

      - name: Attach tarball to the GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "v$VERSION" ./slashgear-gdpr-cookie-scanner-*.tgz
